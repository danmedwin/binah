name: Daily digest email

on:
  schedule:
    # Target: in Dan's inbox before his 6:45am Atlanta commute (10:45 UTC in
    # summer). This cron is deliberately ~7h earlier than that, because
    # GitHub does not run scheduled workflows on time.
    #
    # Through 2026-08-26 it was punctual — 11min-1h late, landing 05:55-06:45
    # EDT. From 2026-08-27 onward every scheduled run in this repo (refresh
    # too, so it is not specific to this workflow) has been 3.3-11.2h late,
    # median 4.1h. Offsetting for the median puts ~86% of days in the inbox
    # before 6:45am; the long-tail days cannot be fixed from here.
    #
    # Kept 80min clear of refresh.yml's slots (05/11/17/23) so the two jobs'
    # `git push` steps don't collide — neither pulls or retries.
    #
    # If GitHub's scheduler recovers to its pre-Aug-27 punctuality, move this
    # back toward 09:45 or the digest will arrive around midnight.
    - cron: "40 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch feeds
        run: python3 fetch_news.py

      - name: Summarize + rebuild the Brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}  # thumbs votes -> taste profile
          DIGEST_RUN: "1"  # dedupe the Brief against yesterday's emailed digest
        run: python3 enrich_news.py

      - name: Send digest email
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python3 send_digest.py

      - name: Commit refreshed data
        # Runs even when enrichment fails: the feed refresh is still worth
        # keeping, and the job's failure is what raises the alarm.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "binah-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "Refresh news data (digest run)"
          git push
